server {
    listen 80;
    root /usr/share/nginx/html;

    # UI-ul afișează prețuri de achiziție: browserul nu are voie să încarce NIMIC din exterior
    # (fără CDN, fonturi, analytics). Tot JS/CSS e servit de aici.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # /api/chat -> backend:8000/chat
    location /api/ {
        access_log off; # OAuth callback codes must never enter access logs
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;   # Colibri pe CPU poate genera minute întregi
        client_max_body_size 50m;
        add_header Cache-Control "no-store" always;  # răspunsurile conțin prețuri interne
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The PDF app has an opaque sandbox origin; CORS applies only to public assets.
    location /pdfcraft/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-JHDu+Ej8RRKyGx1IP3L83mcU+PJYuvvCoVew/IklZwA='; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        gzip on;
        gzip_types application/wasm application/javascript;
    }

    location / {
        try_files $uri /index.html;
    }
}
